# V2D Default Configuration
# Copy and modify this file for custom configurations

system:
  max_concurrent_jobs: 1
  temp_directory: "data/jobs"
  log_level: "INFO"
  log_retention_days: 30

gpu:
  device: "cuda:0"
  max_vram_usage_gb: 12
  prefer_fp16: true

models:
  whisper:
    model_size: "large-v3"
    compute_type: "float16"
    beam_size: 5
    vad_filter: true

  demucs:
    model: "htdemucs"
    shifts: 1
    overlap: 0.25

  marian:
    model: "Helsinki-NLP/opus-mt-ja-en"
    max_length: 512

  tts:
    engine: "xtts"
    sample_rate: 24000

    xtts:
      model_version: "v2.0.2"

    styletts2:
      config_path: "StyleTTS2/Models/LJSpeech/config.yml"

pipeline:
  phases:
    - "phase1"

  extract_audio:
    sample_rate: 24000
    channels: 1
    format: "wav"

  timing:
    max_stretch_ratio: 1.3
    min_stretch_ratio: 0.8
    target_silence_gap_ms: 200

cache:
  voice_cache_path: "data/cache/voices"
  model_cache_path: "data/cache/models"
  max_voice_cache_entries: 1000
  voice_cache_ttl_days: 90

cleanup:
  auto_cleanup_on_success: true
  keep_checkpoints: false
  dry_run: false
