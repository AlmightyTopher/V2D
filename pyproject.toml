[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v2d"
version = "0.1.0"
description = "Video-to-Dub: Local AI dubbing system for Japanese to English video translation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "V2D Contributors"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]
keywords = ["dubbing", "translation", "tts", "whisper", "video"]

dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "faster-whisper>=0.10.0",
    "transformers>=4.35.0",
    "sentencepiece>=0.1.99",
    "demucs>=4.0.0",
    "TTS>=0.21.0",
    "pyyaml>=6.0",
    "jsonschema>=4.17.0",
    "psutil>=5.9.0",
    "pynvml>=11.5.0",
    "ffmpeg-python>=0.2.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
v2d = "v2d.cli:main"

[project.urls]
Homepage = "https://github.com/AlmightyTopher/V2D"
Repository = "https://github.com/AlmightyTopher/V2D"

[tool.setuptools.packages.find]
where = ["."]
include = ["v2d*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
